<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RaceRush v0.4</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#0b1020;
  color:#fff;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding:12px
}

.wrap{
  max-width:700px;
  margin:auto
}

.card{
  background:#151d33;
  border:1px solid #33405f;
  border-radius:18px;
  padding:18px;
  margin:12px 0
}

.center{text-align:center}

.hidden{display:none!important}

.small{
  color:#aab4cf;
  font-size:13px
}

h1{
  font-size:36px;
  margin:5px 0
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

button{
  padding:13px;
  border-radius:12px;
  border:1px solid #425070;
  background:#202b47;
  color:#fff;
  font-weight:800;
  font-size:15px;
  cursor:pointer
}

button:hover{
  filter:brightness(1.15)
}

button:disabled{
  opacity:.45;
  cursor:not-allowed
}

.primary{
  background:#6c7cff;
  border:0
}

.name-input{
  width:100%;
  padding:14px;
  margin:7px 0;
  border-radius:10px;
  border:1px solid #425070;
  background:#0f172a;
  color:white;
  font-size:16px
}

.score{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  font-size:14px;
  font-weight:900
}

.timer{
  text-align:center;
  font-size:40px;
  font-weight:900;
  margin:8px
}

.pill{
  display:inline-block;
  background:#27324f;
  border-radius:20px;
  padding:6px 10px;
  font-size:12px
}

.result{
  font-size:28px;
  font-weight:900
}

.coin{
  font-size:70px;
  margin:15px
}

/* NUMBER HUNT */

.hunt{
  height:340px;
  width:100%;
  position:relative;
  background:radial-gradient(circle,#293861,#10182c);
  border-radius:16px;
  overflow:hidden;
  border:1px solid #3a4768
}

.num{
  position:absolute;
  width:40px;
  height:40px;
  min-width:40px;
  padding:0;
  background:#fff;
  color:#111;
  border:0;
  border-radius:50%;
  font-weight:900;
  font-size:13px
}

/* MATH */

.math-question{
  font-size:32px;
  font-weight:900;
  margin:20px 0
}

/* REACTION */

.reaction-box{
  height:220px;
  border-radius:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#27324f;
  font-size:25px;
  font-weight:900;
  cursor:pointer;
  user-select:none
}

/* MEMORY */

.memory-sequence{
  font-size:35px;
  letter-spacing:8px;
  margin:25px 0;
  min-height:50px
}

/* ODD ONE OUT */

.odd-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px
}

.shape-button{
  font-size:25px;
  height:60px
}

/* RESULTS */

.round-history{
  text-align:left;
  margin-top:15px
}

.round-row{
  display:flex;
  justify-content:space-between;
  gap:8px;
  padding:8px 0;
  border-bottom:1px solid #33405f
}

.final-score{
  font-size:34px;
  font-weight:900;
  margin:15px
}

.danger{
  background:#9b3030;
  border:0
}

@media(max-width:500px){

  body{
    padding:8px
  }

  .card{
    padding:14px
  }

  h1{
    font-size:30px
  }

  .grid{
    grid-template-columns:1fr
  }

  .hunt{
    height:330px
  }

  .num{
    width:36px;
    height:36px;
    min-width:36px;
    font-size:12px
  }

  .score{
    font-size:12px
  }

  .timer{
    font-size:34px
  }

  .odd-grid{
    grid-template-columns:repeat(4,1fr)
  }
}
</style>
</head>

<body>

<div class="wrap">

<div class="center">
<h1>⚡ RACERUSH</h1>
<p class="small">
Two players. Five rounds. One winner.
</p>
</div>


<!-- PLAYER SETUP -->

<section id="setup" class="card">

<h2>👥 Players</h2>

<input
id="player1Input"
class="name-input"
placeholder="Player 1 name"
maxlength="18"
>

<input
id="player2Input"
class="name-input"
placeholder="Player 2 name"
maxlength="18"
>

<button
id="startSetup"
class="primary"
style="width:100%;margin-top:10px"
>
START RACERUSH
</button>

</section>


<!-- TOSS -->

<section id="toss" class="card center hidden">

<span id="tossInfo" class="pill"></span>

<h2>🪙 Coin Toss</h2>

<p id="tossInstruction">
Player 1, choose Heads or Tails.
</p>

<div class="grid">

<button id="headsBtn">
🪙 HEADS
</button>

<button id="tailsBtn">
🪙 TAILS
</button>

</div>

<div id="coin" class="coin">
🪙
</div>

<p id="tossResult" class="result"></p>

<div id="firstChoice" class="hidden">

<p id="winnerChoiceText"></p>

<div class="grid">

<button id="p1First"></button>

<button id="p2First"></button>

</div>

</div>

</section>


<!-- GAME -->

<section id="play" class="card hidden">

<div class="score">

<span>
<span id="p1NameScore"></span>:
<b id="s1">0</b>
</span>

<span id="roundLabel">
Round 1 / 5
</span>

<span>
<span id="p2NameScore"></span>:
<b id="s2">0</b>
</span>

</div>

<div class="timer" id="timer">
0.00
</div>

<div id="task"></div>

<p id="msg" class="center small"></p>

</section>


<!-- ROUND RESULT -->

<section id="roundResult" class="card center hidden">

<span class="pill">
ROUND COMPLETE
</span>

<h2 id="roundWinner"></h2>

<p id="roundTimes"></p>

<button id="nextRound" class="primary">
NEXT ROUND
</button>

</section>


<!-- FINAL RESULT -->

<section id="finalResult" class="card center hidden">

<div style="font-size:60px">
🏆
</div>

<h2 id="finalWinner"></h2>

<div id="finalScore" class="final-score"></div>

<div id="history" class="round-history"></div>

<button id="rematch" class="primary">
🔄 PLAY AGAIN
</button>

</section>

</div>


<script>

let players=["Player 1","Player 2"];

let score=[0,0];

let round=1;

const TOTAL_ROUNDS=5;

let firstPlayer=0;

let currentPlayer=0;

let startTime=0;

let timer=null;

let roundTimes=[null,null];

let roundHistory=[];

let tossChoice=null;

let tossWinner=null;

let reactionReady=false;

let reactionTimer=null;

let memoryAnswer="";

let memoryInput="";

let memoryGiveUp=false;

let turnFinished=false;

const $=id=>document.getElementById(id);


/* PLAYER SETUP */

$("startSetup").addEventListener("click",()=>{

players[0]=$("player1Input").value.trim()||"Player 1";

players[1]=$("player2Input").value.trim()||"Player 2";

$("setup").classList.add("hidden");

$("toss").classList.remove("hidden");

$("tossInfo").textContent=
`${players[0]} vs ${players[1]} • 5 ROUNDS`;

$("tossInstruction").textContent=
`${players[0]}, choose Heads or Tails.`;

});


/* TOSS */

$("headsBtn").addEventListener("click",()=>{

tossChoice="Heads";

flipCoin();

});


$("tailsBtn").addEventListener("click",()=>{

tossChoice="Tails";

flipCoin();

});


function flipCoin(){

$("headsBtn").disabled=true;

$("tailsBtn").disabled=true;

$("coin").textContent="🔄";

$("tossInstruction").textContent=
`${players[0]} chose ${tossChoice}. Flipping...`;

setTimeout(()=>{

const result=
Math.random()<0.5?"Heads":"Tails";

$("coin").textContent=
result==="Heads"?"🙂":"🔵";

tossWinner=
result===tossChoice?0:1;

$("tossResult").textContent=
`${result}! ${players[tossWinner]} won the toss!`;

$("winnerChoiceText").textContent=
`${players[tossWinner]}, choose who goes first.`;

$("p1First").textContent=
`${players[0]} goes first`;

$("p2First").textContent=
`${players[1]} goes first`;

$("firstChoice").classList.remove("hidden");

},1000);

}


/* FIRST PLAYER */

$("p1First").addEventListener("click",()=>beginGame(0));

$("p2First").addEventListener("click",()=>beginGame(1));


function beginGame(player){

firstPlayer=player;

currentPlayer=player;

$("toss").classList.add("hidden");

$("play").classList.remove("hidden");

updateScore();

startTurn();

}


/* SCORE */

function updateScore(){

$("p1NameScore").textContent=players[0];

$("p2NameScore").textContent=players[1];

$("s1").textContent=score[0];

$("s2").textContent=score[1];

$("roundLabel").textContent=
`Round ${round} / ${TOTAL_ROUNDS}`;

}


/* START TURN */

function startTurn(){

clearInterval(timer);

clearTimeout(reactionTimer);

turnFinished=false;

roundTimes[currentPlayer]=null;

memoryInput="";

memoryGiveUp=false;

updateScore();

$("msg").textContent=
`${players[currentPlayer]}'s turn`;

startTime=performance.now();

timer=setInterval(()=>{

$("timer").textContent=
((performance.now()-startTime)/1000).toFixed(2);

},20);

chooseMiniGame();

}


/* FINISH TURN */

function finishTurn(penaltySeconds=null){

if(turnFinished)return;

turnFinished=true;

clearInterval(timer);

clearTimeout(reactionTimer);

const elapsed=
penaltySeconds!==null
?penaltySeconds
:(performance.now()-startTime)/1000;

roundTimes[currentPlayer]=elapsed;

$("timer").textContent=
elapsed.toFixed(2);

if(penaltySeconds!==null){

$("msg").textContent=
`${players[currentPlayer]} gave up — ${elapsed.toFixed(2)}s penalty`;

}else{

$("msg").textContent=
`${players[currentPlayer]} finished in ${elapsed.toFixed(2)} seconds`;

}


/*
Both players MUST play
before the round is decided.
*/

if(currentPlayer===firstPlayer){

currentPlayer=1-firstPlayer;

setTimeout(startTurn,900);

}else{

setTimeout(showRoundResult,700);

}

}


/* MINI GAME SELECTION */

function chooseMiniGame(){

const games=[
"hunt",
"math",
"reaction",
"odd",
"memory"
];

const game=
games[Math.floor(Math.random()*games.length)];

if(game==="hunt"){

numberHunt();

}

else if(game==="math"){

quickMath();

}

else if(game==="reaction"){

reactionGame();

}

else if(game==="odd"){

oddOneOut();

}

else{

memoryGame();

}

}


/* NUMBER HUNT */

function numberHunt(){

const numbers=[];

while(numbers.length<18){

const n=
Math.floor(Math.random()*30)+1;

if(!numbers.includes(n)){

numbers.push(n);

}

}

const target=
numbers[
Math.floor(Math.random()*numbers.length)
];


$("task").innerHTML=`

<div class="card">

<div style="
display:flex;
justify-content:space-between;
align-items:center
">

<h2>🔎 Number Hunt</h2>

<span class="pill">
FIND ${target}
</span>

</div>

<p class="small">
Find the target. Every number must remain visible.
</p>

<div id="huntBoard" class="hunt"></div>

</div>

`;


const board=$("huntBoard");

const positions=[];

const w=board.clientWidth;

const h=board.clientHeight;

const size=42;


numbers.forEach(number=>{

let x=0;

let y=0;

let placed=false;


/*
Try many random positions.
Reject a position if it would
overlap another number.
*/

for(
let tries=0;
tries<100&&!placed;
tries++
){

x=4+
Math.random()*
Math.max(1,88-size*100/w);

y=5+
Math.random()*
Math.max(1,80-size*100/h);

const px=x*w/100;

const py=y*h/100;

if(
positions.every(
p=>Math.hypot(px-p.x,py-p.y)>size+5
)
){

positions.push({
x:px,
y:py
});

placed=true;

}

}


/*
Emergency fallback.
*/

if(!placed){

const row=positions.length%4;

const col=Math.floor(positions.length/4);

x=5+row*22;

y=5+col*18;

}


const button=
document.createElement("button");

button.className="num";

button.textContent=number;

button.style.left=x+"%";

button.style.top=y+"%";

button.style.transform=
`rotate(${Math.random()*36-18}deg)`;


button.addEventListener(
"click",
()=>{

if(number===target){

finishTurn();

}else{

button.disabled=true;

}

});


board.appendChild(button);

});

}


/* QUICK MATH */

function quickMath(){

const a=
Math.floor(Math.random()*15)+1;

const b=
Math.floor(Math.random()*15)+1;

const op=
["+","-","×"]
[Math.floor(Math.random()*3)];

let answer;

if(op==="+"){

answer=a+b;

}

else if(op==="-"){

answer=a-b;

}

else{

answer=a*b;

}


const options=[answer];

while(options.length<4){

const wrong=
answer+
Math.floor(Math.random()*11)-5;

if(!options.includes(wrong)){

options.push(wrong);

}

}

options.sort(
()=>Math.random()-.5
);


$("task").innerHTML=`

<div class="card center">

<h2>🧮 Quick Math</h2>

<div class="math-question">
${a} ${op} ${b} = ?
</div>

<div class="grid" id="mathOptions"></div>

</div>

`;


options.forEach(value=>{

const button=
document.createElement("button");

button.textContent=value;

button.addEventListener(
"click",
()=>{

if(value===answer){

finishTurn();

}else{

button.disabled=true;

}

});

$("mathOptions").appendChild(button);

});

}


/* REACTION RUSH */

function reactionGame(){

$("task").innerHTML=`

<div class="card center">

<h2>⚡ Reaction Rush</h2>

<p class="small">
Wait for GO. Then tap the moving target.
</p>

<div id="reactionBox"
class="reaction-box">

WAIT...

</div>

</div>

`;


const box=$("reactionBox");

reactionReady=false;


box.addEventListener(
"click",
()=>{

if(!reactionReady){

$("msg").textContent=
"❌ Too early! Wait for GO.";

return;

}

finishTurn();

});


const delay=
1500+
Math.random()*2500;


reactionTimer=
setTimeout(()=>{

reactionReady=true;

box.textContent=
"🚀 TAP NOW!";

box.style.background=
"#26733d";


const move=
setInterval(()=>{

if(turnFinished){

clearInterval(move);

return;

}

box.style.transform=
`translate(
${(Math.random()*70)-35}px,
${(Math.random()*40)-20}px
)`;

},350);


setTimeout(()=>{

if(!turnFinished){

clearInterval(move);

box.style.transform="none";

reactionReady=false;

box.textContent=
"💨 MISSED! Tap to try again";

box.style.background=
"#27324f";

setTimeout(()=>{

if(!turnFinished){

reactionGame();

}

},500);

}

},2200);

},delay);

}


/* ODD ONE OUT */

function oddOneOut(){

const shapes=[
"🔵",
"🔴",
"🟢",
"🟡"
];

const common=
shapes[
Math.floor(Math.random()*4)
];

let odd=
shapes[
Math.floor(Math.random()*4)
];

while(odd===common){

odd=
shapes[
Math.floor(Math.random()*4)
];

}

const oddIndex=
Math.floor(Math.random()*12);


$("task").innerHTML=`

<div class="card center">

<h2>👀 Odd One Out</h2>

<p class="small">
Tap the different shape.
</p>

<div id="oddGrid"
class="odd-grid">
</div>

</div>

`;


for(
let i=0;
i<12;
i++
){

const button=
document.createElement("button");

button.className=
"shape-button";

button.textContent=
i===oddIndex
?odd
:common;


button.addEventListener(
"click",
()=>{

if(i===oddIndex){

finishTurn();

}else{

button.disabled=true;

}

});


$("oddGrid").appendChild(button);

}

}


/* MEMORY GAME */

function memoryGame(){

const symbols=[
"🍎",
"🍌",
"🍇",
"🍊",
"🍉",
"🥝"
];

const sequence=[];


for(
let i=0;
i<5;
i++
){

sequence.push(
symbols[
Math.floor(Math.random()*symbols.length)
]
);

}


memoryAnswer=
sequence.join("");


$("task").innerHTML=`

<div class="card center">

<h2>🧠 Memory Pattern</h2>

<p class="small">
You have <b>10 seconds</b>
to memorize the pattern.
</p>

<div id="memoryCountdown"
class="pill">
10 seconds
</div>

<div id="memorySequence"
class="memory-sequence">

${memoryAnswer}

</div>

<div id="memoryControls"
class="hidden">

<p class="small">
Repeat the pattern in the correct order.
</p>

<div
class="grid"
id="memoryButtons">
</div>

<p
id="memoryInput"
class="result">
</p>

<button
id="giveUp"
class="danger"
style="width:100%;margin-top:10px">

I GIVE UP

</button>

</div>

</div>

`;


let seconds=10;


const countdown=
setInterval(()=>{

seconds--;

$("memoryCountdown").textContent=
`${seconds} second${seconds===1?"":"s"} left`;


if(seconds<=0){

clearInterval(countdown);

$("memorySequence").textContent=
"❓ ❓ ❓ ❓ ❓";

$("memoryControls")
.classList.remove("hidden");

buildMemoryButtons();

}

},1000);

}


/* MEMORY BUTTONS */

function buildMemoryButtons(){

const symbols=[
"🍎",
"🍌",
"🍇",
"🍊",
"🍉",
"🥝"
];


symbols.forEach(symbol=>{

const button=
document.createElement("button");

button.textContent=symbol;


button.addEventListener(
"click",
()=>{

if(turnFinished)return;

memoryInput+=symbol;

$("memoryInput").textContent=
memoryInput;


if(
memoryInput.length===
memoryAnswer.length
){

if(
memoryInput===
memoryAnswer
){

finishTurn();

}else{

memoryInput="";

$("memoryInput").textContent="";

$("msg").textContent=
"Wrong pattern — try again.";

}

}

});


$("memoryButtons")
.appendChild(button);

});


$("giveUp").addEventListener(
"click",
()=>{

memoryGiveUp=true;

finishTurn(20);

});

}


/* ROUND RESULT */

function showRoundResult(){

$("play").classList.add("hidden");

$("roundResult")
.classList.remove("hidden");


const p1=roundTimes[0];

const p2=roundTimes[1];

let winner=-1;


if(p1<p2){

winner=0;

}

else if(p2<p1){

winner=1;

}


if(winner>=0){

score[winner]++;

$("roundWinner").textContent=
`🏆 ${players[winner]} wins Round ${round}!`;

}else{

$("roundWinner").textContent=
"🤝 Round Draw!";

}


$("roundTimes").innerHTML=`

${players[0]}:
<b>${p1.toFixed(2)}s</b>

&nbsp; • &nbsp;

${players[1]}:
<b>${p2.toFixed(2)}s</b>

`;


roundHistory.push({

round:round,

winner:winner,

p1:p1,

p2:p2

});

}


/* NEXT ROUND */

$("nextRound").addEventListener(
"click",
()=>{

$("roundResult")
.classList.add("hidden");


if(round>=TOTAL_ROUNDS){

showFinalResult();

return;

}


round++;

firstPlayer=
1-firstPlayer;

currentPlayer=
firstPlayer;

$("play")
.classList.remove("hidden");

startTurn();

});


/* FINAL RESULT */

function showFinalResult(){

clearInterval(timer);

$("roundResult")
.classList.add("hidden");

$("play")
.classList.add("hidden");

$("finalResult")
.classList.remove("hidden");


let winner=-1;


if(score[0]>score[1]){

winner=0;

}

else if(score[1]>score[0]){

winner=1;

}


if(winner>=0){

$("finalWinner").textContent=
`🏆 ${players[winner]} WINS RACERUSH!`;

}else{

$("finalWinner").textContent=
"🤝 RACERUSH ENDS IN A DRAW!";

}


$("finalScore").textContent=
`${score[0]} — ${score[1]}`;


$("history").innerHTML=
roundHistory.map(x=>`

<div class="round-row">

<span>
Round ${x.round}
</span>

<span>
${x.winner<0
?"Draw"
:players[x.winner]}
</span>

<span>
${x.p1.toFixed(2)}s /
${x.p2.toFixed(2)}s
</span>

</div>

`).join("");

}


/* REMATCH */

$("rematch").addEventListener(
"click",
()=>location.reload()
);

</script>

</body>
</html>
